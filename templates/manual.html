{% extends "base.html" %}
{% block content %}
<div class="form-page">
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h4 mb-4">Kitabı elle ekle</h1>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Kitap adı *</label><input class="form-control" name="title" required></div>
          <div class="col-md-6"><label class="form-label">Yazar</label><input class="form-control" name="author"></div>
          <div class="col-md-6"><label class="form-label">Yayınevi</label><input class="form-control" name="publisher"></div>
          <div class="col-md-3"><label class="form-label">Sayfa sayısı *</label><input class="form-control" type="number" min="1" name="page_count" required></div>
          <div class="col-md-3"><label class="form-label">Yayın yılı</label><input class="form-control" type="number" name="publish_year"></div>
          <div class="col-md-6"><label class="form-label">ISBN</label><input class="form-control" name="isbn"></div>
          <div class="col-md-6"><label class="form-label">Kitapyurdu linki</label><input class="form-control" name="external_url"></div>
          <div class="col-md-6"><label class="form-label">Raf</label>
            <select class="form-select" name="status">
              {% for status, label in status_labels.items() %}
              <option value="{{ status }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <button class="btn btn-primary mt-4" type="submit">Kitaba ekle</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
