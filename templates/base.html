<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitap Takip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
{% if logged_in %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container-fluid px-lg-4">
    <a class="navbar-brand brand" href="{{ url_for('library') }}">📚 Kitap Takip</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <form class="search-form mx-lg-auto my-2 my-lg-0" action="{{ url_for('search') }}" method="get">
        <input class="form-control" type="search" name="q" placeholder="Kitap, yazar veya ISBN ara"
               value="{{ query|default('') }}">
      </form>
      <div class="navbar-nav ms-lg-auto">
        <a class="nav-link" href="{{ url_for('library') }}">Kitaplık</a>
        <a class="nav-link" href="{{ url_for('statistics') }}">İstatistik</a>
        <a class="nav-link" href="{{ url_for('settings') }}">Ayarlar</a>
        <a class="nav-link" href="{{ url_for('logout') }}">Çıkış</a>
      </div>
    </div>
  </div>
</nav>
{% endif %}
<main class="container py-4">
  {% if flash_error %}<div class="alert alert-danger">{{ flash_error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
